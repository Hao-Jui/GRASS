name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran liblapack-dev libblas-dev libfftw3-dev pkg-config

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Create output directories
        run: mkdir -p Cont Res

      - name: Run unit tests
        run: ctest --test-dir build -R "test_(ad|spline|spectral|brent|eos)" --output-on-failure

      - name: Run GR integration tests
        run: ctest --test-dir build -R "test_gr_|create_output" --output-on-failure

      - name: Run restart test
        run: ctest --test-dir build -R "test_restart" --output-on-failure

      - name: Run ST integration tests (platform-sensitive)
        continue-on-error: true
        run: |
          ctest --test-dir build -R "test_st_" --output-on-failure \
            || echo "::warning::ST tests failed — expected on Linux (LAPACK sensitivity)"

  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran liblapack-dev libblas-dev libfftw3-dev pkg-config

      - name: Configure (Sanitizer)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Sanitizer

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run unit tests with sanitizer
        run: ctest --test-dir build -R "test_(ad|spline|spectral|brent|eos)" --output-on-failure
