name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran liblapack-dev libblas-dev libfftw3-dev pkg-config

      - name: Build library
        run: make libgrass.a

      - name: Run unit tests
        run: make test-unit

      - name: Create output directories
        run: mkdir -p Cont Res

      - name: Run integration tests
        id: integration
        run: make test-integration
        continue-on-error: true

      - name: Diagnose integration failures
        if: steps.integration.outcome == 'failure'
        run: |
          echo "=== Cont/properties.dat ==="
          cat Cont/properties.dat 2>/dev/null || echo "(not found)"
          echo ""
          for ref in tests/reference/test_*.ref; do
            name=$(basename "$ref" .ref)
            echo "--- $name ---"
            bash tests/check_regression.sh Cont/properties.dat "$ref" || true
          done

      - name: Fail if integration tests failed
        if: steps.integration.outcome == 'failure'
        run: exit 1

  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran liblapack-dev libblas-dev libfftw3-dev pkg-config

      - name: Run sanitizer tests
        run: make test-sanitizer
